apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: api
workload:
  uri: https://services.example.com/api
extensions:
  - https://runtimeconditions.io/extensions/common-integrations/v1alpha1/runtimeconditions.extension.yaml
conditions:
  - kind: api
    interface:
      type: http
      operations:
        - method: GET
          path: /orders
        - method: POST
          path: /orders/new
          requestBodySchema:
            name: string
            tags:
              - string
